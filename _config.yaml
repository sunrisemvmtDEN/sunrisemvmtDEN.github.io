title: Sunrise Movement Denver Hub's 2026 Midterm Elections Ballot Guide
description: Sunrise Movement is a nationwide youth-led organization fighting to stop climate change and create millions of good jobs in the process. This is our 2026 Midterm Elections Ballot Guide for the Denver Metro Area. We've spent the over a year researching the candidates, their stances, and the list of ballot measures; we hope this guide will help you make informed decisions in another critical election. Share this with your friends and consider filling out your ballots together!
