title: Sunrise Movement Denver Hub's 2026 Midterm Elections Ballot Guide
description: Sunrise Movement is a nationwide youth-led organization fighting to stop climate change and create millions of good jobs in the process. This is our 2026 Midterm Elections Ballot Guide for the Denver Metro Area. We spent the last year researching the candidates, their stances, and the list of ballot measures; we hope this guide will help you make informed decisions at the ballot box. Share this with friends and fill out your ballots together!