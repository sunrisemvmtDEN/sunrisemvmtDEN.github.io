title: Sunrise Movement Denver Hub's 2026 Midterm Elections Ballot Guide
description: Sunrise Movement is a nationwide youth-led organization fighting to stop climate change and create millions of good jobs in the process. This is our 2026 Midterm Elections Ballot Guide for the Denver Metro Area. We spent the last year researching the candidates and their stances; we hope this guide will help you make informed decisions at the ballot box. We will be updating this guide as we learn more about the candidates and their positions, so check back often!
