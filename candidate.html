---
layout: default
title: Candidate Profile
hide_site_header: true
---

<style>
  :root {
    --sunrise-maroon: #8f0d56;
    --denver-white: #ffffff;
    --denver-sky-blue: #0096d6;
    --sunrise-charcoal: #33342e;
    --accent-soft: #f9f1bc;
    --line: var(--sunrise-maroon);
  }

  .profile-wrap {
    max-width: 920px;
    margin-top: 1rem;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 1rem;
    color: var(--denver-sky-blue);
    font-weight: 600;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .profile-card {
    background: var(--denver-white);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(51, 52, 46, 0.08);
    overflow: hidden;
  }

  .profile-header {
    padding: 1rem 1.2rem;
    background: var(--sunrise-gold);
    border-bottom: 1px solid var(--line);
  }

  .profile-header h2 {
    margin: 0;
    font-size: 1.4rem;
    color: var(--sunrise-charcoal);
  }

  .profile-table {
    width: 100%;
    border-collapse: collapse;
  }

  .profile-table th,
  .profile-table td {
    padding: 0.9rem 1.1rem;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
    line-height: 1.5;
  }

  .profile-table th {
    width: 35%;
    min-width: 210px;
    background: var(--accent-soft);
    color: var(--sunrise-charcoal);
    font-weight: 600;
  }

  .profile-table td {
    color: var(--sunrise-charcoal);
    white-space: pre-wrap;
  }

  .profile-table a {
    color: var(--denver-sky-blue);
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .profile-table a:hover {
    color: var(--denver-sky-blue);
  }

  @media (max-width: 768px) {
    .profile-table th,
    .profile-table td {
      display: block;
      width: 100%;
    }

    .profile-table th {
      border-bottom: none;
      padding-bottom: 0.3rem;
    }

    .profile-table td {
      padding-top: 0.2rem;
    }
  }
</style>

<div class="profile-wrap">
  <a class="back-link" href="{{ '/' | relative_url }}">Back to candidate responses table</a>

  <div id="profile-card" class="profile-card" hidden>
    <div class="profile-header">
      <h2 id="candidate-name">Candidate</h2>
    </div>
    <table class="profile-table" id="profile-table"></table>
  </div>
</div>

<script>
  const localCsvPath = "{{ site.local_csv_path | escape }}";
  const csvUrl = "{{ site.google_sheet_csv_url | escape }}";

  function parseCsv(text) {
    const rows = [];
    let row = [];
    let value = "";
    let inQuotes = false;

    for (let i = 0; i < text.length; i += 1) {
      const ch = text[i];
      const next = text[i + 1];

      if (ch === '"') {
        if (inQuotes && next === '"') {
          value += '"';
          i += 1;
        } else {
          inQuotes = !inQuotes;
        }
      } else if (ch === "," && !inQuotes) {
        row.push(value.trim());
        value = "";
      } else if ((ch === "\n" || ch === "\r") && !inQuotes) {
        if (ch === "\r" && next === "\n") {
          i += 1;
        }
        row.push(value.trim());
        value = "";
        if (row.some((cell) => cell !== "")) {
          rows.push(row);
        }
        row = [];
      } else {
        value += ch;
      }
    }

    if (value.length > 0 || row.length > 0) {
      row.push(value.trim());
      if (row.some((cell) => cell !== "")) {
        rows.push(row);
      }
    }

    return rows;
  }

  function escapeHtml(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function toCandidateWebsiteUrl(value) {
    const trimmed = String(value || "").trim();
    if (!trimmed) {
      return "";
    }

    // Normalize common entries that omit protocol.
    const withProtocol = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;

    try {
      return new URL(withProtocol).href;
    } catch {
      return "";
    }
  }

  function normalizeHeader(value) {
    return String(value || "")
      .replace(/\s+/g, " ")
      .trim()
      .toLowerCase();
  }

  function isNoResponse(value) {
    const normalized = String(value || "").trim().toLowerCase();
    return normalized.startsWith("no");
  }

  async function loadProfile() {
    const cardEl = document.getElementById("profile-card");
    const tableEl = document.getElementById("profile-table");
    const nameEl = document.getElementById("candidate-name");

    const params = new URLSearchParams(window.location.search);
    const rowId = Number(params.get("id"));

    if (!Number.isInteger(rowId) || rowId < 0) {
      console.error("Invalid candidate link.");
      return;
    }

    const sourceUrl = localCsvPath || csvUrl;
    const sourceLabel = localCsvPath ? "local CSV file" : "Google Sheet CSV";

    if (!sourceUrl) {
      console.error("Set local_csv_path or google_sheet_csv_url in _config.yaml.");
      return;
    }

    try {
      const res = await fetch(sourceUrl, { cache: "no-store" });
      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }

      const csvText = await res.text();
      if (/<!doctype html|<html|\.gb_[A-Za-z0-9_-]+\{|<head|<body/i.test(csvText)) {
        throw new Error(`${sourceLabel} returned HTML instead of CSV`);
      }

      const rows = parseCsv(csvText);
      if (rows.length < 2) {
        throw new Error("CSV has no candidate rows");
      }

      const headers = rows[0].slice(1);
      const allCandidateRows = rows.slice(1).map((r) => r.slice(1));
      const row = allCandidateRows[rowId];

      if (!row) {
        throw new Error("Candidate not found");
      }

      while (row.length < headers.length) {
        row.push("");
      }

      const profileFields = new Set([
        "state/position/district",
        "type of race",
        "candidate website",
        "party affiliation",
        "are you a current or former elected official?",
        "if so, what office(s) have you held?",
      ]);

      const detailRows = [];
      let longPromptValue = "";
      let candidateName = "Candidate";
      let electedOfficialValue = "";

      headers.forEach((header, idx) => {
        const normalized = normalizeHeader(header);
        const value = row[idx] || "";

        if (normalized === "candidate name") {
          candidateName = value || candidateName;
        }

        if (normalized === "are you a current or former elected official?") {
          electedOfficialValue = value;
        }

        if (profileFields.has(normalized)) {
          detailRows.push({ label: header, value });
        }

        if (normalized.startsWith("some suggested prompts:")) {
          longPromptValue = value;
        }
      });

      if (longPromptValue) {
        detailRows.push({ label: "Candidate Statement", value: longPromptValue });
      }

      const filteredDetailRows = detailRows.filter((item) => {
        const normalizedLabel = normalizeHeader(item.label);
        if (normalizedLabel === "if so, what office(s) have you held?" && isNoResponse(electedOfficialValue)) {
          return false;
        }
        return true;
      });

      nameEl.textContent = candidateName;

      tableEl.innerHTML = filteredDetailRows
        .map((item) => {
          const normalizedLabel = normalizeHeader(item.label);
          if (normalizedLabel === "candidate website") {
            const href = toCandidateWebsiteUrl(item.value);
            if (href) {
              return `<tr><th>${escapeHtml(item.label)}</th><td><a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.value)}</a></td></tr>`;
            }
          }

          return `<tr><th>${escapeHtml(item.label)}</th><td>${escapeHtml(item.value)}</td></tr>`;
        })
        .join("");

      cardEl.hidden = false;
    } catch (err) {
      console.error(`Could not load candidate profile (${err.message}).`);
    }
  }

  loadProfile();
</script>
